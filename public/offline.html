<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#156084">
  <title>You are offline | Margaret Amshi Foundation</title>
  <style>
    :root{--navy:#0D3B53;--ocean:#156084;--sky:#5EBCDC;--mist:#EAF5FA;--charcoal:#1F2A30}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--charcoal);background:linear-gradient(160deg,#082638,var(--navy) 45%,var(--ocean));}
    main{width:100%;max-width:34rem;background:#fff;border-radius:2rem;padding:2.5rem 2rem;text-align:center;box-shadow:0 30px 70px -30px rgba(0,0,0,.5)}
    img{width:150px;height:auto}
    h1{color:var(--navy);font-size:1.75rem;margin:1.25rem 0 .5rem;line-height:1.15}
    p{line-height:1.6;margin:.5rem 0}
    .actions{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin-top:1.5rem}
    a,button{font:inherit;font-weight:600;border-radius:999px;padding:.85rem 1.4rem;text-decoration:none;border:2px solid var(--ocean);cursor:pointer;min-height:48px}
    .primary{background:var(--ocean);color:#fff}
    .secondary{background:#fff;color:var(--ocean)}
    a:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="150" height="150" alt="Margaret Amshi Foundation logo">
    <h1>You are offline</h1>
    <p>We could not reach the internet. Pages you have already visited may still open. Check your connection and try again.</p>
    <p>Need us now? Call <a href="tel:+2349117776004" style="border:0;padding:0;font-weight:700;color:var(--ocean)">0911 777 6004</a> or <a href="tel:+2349037246971" style="border:0;padding:0;font-weight:700;color:var(--ocean)">0903 724 6971</a>.</p>
    <div class="actions">
      <button class="primary" type="button" onclick="location.reload()">Try again</button>
      <a class="secondary" href="https://wa.me/2349117776004">WhatsApp us</a>
    </div>
  </main>
</body>
</html>
